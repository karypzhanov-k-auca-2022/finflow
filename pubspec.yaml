name: finflow
description: "FinFlow — offline-first personal finance tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.5
  dio: ^5.9.0
  device_info_plus: ^13.2.0
  equatable: ^2.0.7
  fl_chart: ^1.1.1
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.3
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  freezed_annotation: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: any
  freezed: any

flutter:
  generate: true
  uses-material-design: true
